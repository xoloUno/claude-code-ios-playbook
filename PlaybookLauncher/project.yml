name: PlaybookLauncher
options:
  bundleIdPrefix: com.xolouno
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.3"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  PlaybookLauncher:
    type: application
    platform: macOS
    sources:
      - path: PlaybookLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xolouno.playbooklauncher
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
